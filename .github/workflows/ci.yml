name: PRISM Multi-Page Editorial Platform CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    name: Full-Stack Verification & Multi-Page QA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js v24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests (Content Preservation Invariants)
        run: npm run test:unit

      - name: Run Backend REST API Integration Tests
        run: npm run test:api

      - name: Verify Production Client Build
        run: npm run build

      - name: Install Playwright Chromium Browser
        run: npx playwright install chromium --with-deps

      - name: Start Background Servers & Execute Multi-Page QA Suite
        run: |
          node server/src/server.js &
          npx vite --port 5173 --host &
          sleep 5
          npm run test:multipage
        env:
          NODE_ENV: test
          PORT: 4000
          CLIENT_ORIGIN: http://localhost:5173
          JWT_SECRET: ci_pipeline_super_secret_jwt_key_2026
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: AdminSecurePassword2026!
