<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <rect width="48" height="48" rx="10" fill="#25262B" />
  <g transform="translate(0, 2.5)">
    <!-- Outer Triangle -->
    <polygon points="4,5 44,5 24,43" stroke="#B49A70" stroke-width="2.5" stroke-linejoin="round" fill="none" />
    <!-- Internal Facet lines -->
    <line x1="4" y1="5" x2="24" y2="16" stroke="#B49A70" stroke-width="2.5" stroke-linecap="round" />
    <line x1="44" y1="5" x2="24" y2="16" stroke="#B49A70" stroke-width="2.5" stroke-linecap="round" />
    <line x1="24" y1="16" x2="24" y2="43" stroke="#B49A70" stroke-width="2.5" stroke-linecap="round" />
    <!-- Diagonal hatching on right facet -->
    <line x1="24" y1="20" x2="39" y2="12" stroke="#B49A70" stroke-width="1.8" stroke-linecap="round" />
    <line x1="24" y1="25" x2="35" y2="18" stroke="#B49A70" stroke-width="1.8" stroke-linecap="round" />
    <line x1="24" y1="30" x2="32" y2="24" stroke="#B49A70" stroke-width="1.8" stroke-linecap="round" />
    <line x1="24" y1="35" x2="28" y2="31" stroke="#B49A70" stroke-width="1.8" stroke-linecap="round" />
  </g>
</svg>
